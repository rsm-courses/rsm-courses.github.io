---
layout: default
---
<h1>{{ page.title }}</h1>
{% if page.status %}<p><em>Status: {{ page.status }}</em></p>{% endif %}
{% if page.partners %}
<p><strong>Partners:</strong> {{ page.partners | join: ", " }}</p>
{% endif %}

{{ content }}

<p><a href="{{ page.back_url | default: '/courses/' | relative_url }}">&larr; {{ page.back_title | default: "Back to all courses" }}</a></p>
