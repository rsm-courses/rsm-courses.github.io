title: RSM Courses
description: >-
  Course offerings and self-guided teaching materials from the
  Research Software Management team.
baseurl: "" # leave empty for a <org>.github.io root site
url: "https://rsm-courses.github.io"

# Theme: remote_theme works out of the box on GitHub Pages, no gem installs needed.
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

collections:
  courses:
    output: true
    permalink: /courses/:path/

defaults:
  - scope:
      path: ""
      type: "courses"
    values:
      layout: "course"

markdown: kramdown
kramdown:
  syntax_highlighter: rouge

nav:
  - title: Home
    url: /
  - title: Courses
    url: /courses/
  - title: Materials
    url: /materials/